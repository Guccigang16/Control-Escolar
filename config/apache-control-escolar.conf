# VirtualHost de Apache para el Sistema de Control Escolar.
# scripts/instalar_apache.sh lo copia a /etc/apache2/sites-available/control-escolar.conf
# Solo la carpeta app/ queda publicada; config/, database/ y scripts/ quedan fuera de la web.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/control-escolar/app

    <Directory /var/www/control-escolar/app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/control_escolar_error.log
    CustomLog ${APACHE_LOG_DIR}/control_escolar_access.log combined
</VirtualHost>
